<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALPIS ImpactPath v3.5</title>
  <style>
    :root {
      --bg: #07111f;
      --bg-soft: #0d1b2d;
      --panel: rgba(13, 27, 45, 0.86);
      --panel-2: rgba(255,255,255,0.04);
      --line: rgba(255,255,255,0.08);
      --text: #eef4ff;
      --muted: #a8bad6;
      --primary: #6ea8fe;
      --primary-2: #4f8dff;
      --accent: #7ef0c2;
      --warning: #ffd166;
      --danger: #ff7b7b;
      --success: #8de7a8;
      --shadow: 0 18px 50px rgba(0,0,0,0.3);
      --radius: 24px;
      --radius-sm: 16px;
      --max: 1320px;
      --bottom-nav-h: 72px;
      --ring-bg: rgba(255,255,255,0.08);
      --ring-track: rgba(255,255,255,0.08);
      --card-hover: translateY(-3px);
      --surface: rgba(255,255,255,0.03);
    }

    body.theme-light {
      --bg: #f4f8ff;
      --bg-soft: #e8f0ff;
      --panel: rgba(255,255,255,0.92);
      --panel-2: rgba(0,0,0,0.03);
      --line: rgba(12, 32, 60, 0.09);
      --text: #11243c;
      --muted: #5c708c;
      --primary: #3c7cff;
      --primary-2: #235df0;
      --accent: #1fc98a;
      --warning: #d99c15;
      --danger: #df5d5d;
      --success: #2fa366;
      --shadow: 0 18px 50px rgba(38,72,119,0.12);
      --ring-bg: rgba(17,36,60,0.08);
      --ring-track: rgba(17,36,60,0.08);
      --surface: rgba(17,36,60,0.03);
      background:
        radial-gradient(circle at top left, rgba(60,124,255,0.12), transparent 22%),
        radial-gradient(circle at top right, rgba(31,201,138,0.08), transparent 18%),
        linear-gradient(180deg, #f7fbff 0%, #edf3ff 100%);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(110,168,254,0.18), transparent 22%),
        radial-gradient(circle at top right, rgba(126,240,194,0.12), transparent 18%),
        linear-gradient(180deg, #07111f 0%, #081425 100%);
      min-height: 100vh;
      transition: background 180ms ease, color 180ms ease;
    }

    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    img { max-width: 100%; display: block; }

    .shell {
      width: min(100% - 24px, var(--max));
      margin: 0 auto;
      padding: 18px 0 calc(120px + var(--bottom-nav-h));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 70;
      backdrop-filter: blur(16px);
      background: color-mix(in srgb, var(--bg) 78%, transparent);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      width: min(100% - 24px, var(--max));
      margin: 0 auto;
      min-height: 74px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-badge {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #05111f;
      font-weight: 800;
      box-shadow: var(--shadow);
      flex: 0 0 auto;
    }

    .brand-copy h1 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.1;
    }

    .brand-copy p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 44vw;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn, .chip, .tab-btn, .bottom-nav a, .sort-chip {
      border: 1px solid var(--line);
      color: var(--text);
      background: rgba(255,255,255,0.04);
      border-radius: 999px;
      padding: 10px 14px;
      transition: 180ms ease;
    }

    .btn:hover, .chip:hover, .tab-btn:hover, .bottom-nav a:hover, .sort-chip:hover {
      transform: translateY(-1px);
    }

    .card, .result-card, .mission-card, .entry-card, .pin-card, .roadmap-step, .persona-card, .feature-card, .badge-card, .testimonial-card, .skeleton-card, .admin-card {
      transition: 180ms ease;
    }

    .card:hover, .result-card:hover, .mission-card:hover, .pin-card:hover, .badge-card:hover, .feature-card:hover, .persona-card:hover, .testimonial-card:hover {
      transform: var(--card-hover);
      border-color: rgba(110,168,254,0.22);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      border-color: transparent;
      color: white;
      box-shadow: 0 10px 28px rgba(79,141,255,0.26);
    }

    .btn.success {
      background: linear-gradient(135deg, #4caf7a, #60cb8f);
      border-color: transparent;
      color: white;
    }

    .btn.ghost.active,
    .chip.active,
    .tab-btn.active,
    .bottom-nav a.active,
    .sort-chip.active {
      background: rgba(110,168,254,0.16);
      border-color: rgba(110,168,254,0.34);
      color: white;
    }

    body.theme-light .btn.ghost.active,
    body.theme-light .chip.active,
    body.theme-light .tab-btn.active,
    body.theme-light .bottom-nav a.active,
    body.theme-light .sort-chip.active {
      color: var(--text);
    }

    .hero {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 18px;
      margin-top: 20px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      position: relative;
      overflow: hidden;
      transition: background 180ms ease, border-color 180ms ease;
    }

    .hero-card {
      min-height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
    }

    .hero-card::after {
      content: "";
      position: absolute;
      inset: auto -60px -100px auto;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(126,240,194,0.22), transparent 66%);
      z-index: 0;
    }

    .hero-card > * { position: relative; z-index: 1; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      width: fit-content;
      font-size: 0.88rem;
      color: #c9ffe9;
      background: rgba(126,240,194,0.12);
      border: 1px solid rgba(126,240,194,0.18);
    }

    body.theme-light .eyebrow {
      color: #0f6b4a;
      background: rgba(31,201,138,0.1);
      border-color: rgba(31,201,138,0.18);
    }

    .hero h2 {
      margin: 14px 0 12px;
      font-size: clamp(1.9rem, 3vw, 3.4rem);
      line-height: 1.05;
      max-width: 13ch;
    }

    .hero p { margin: 0; color: var(--muted); max-width: 62ch; }
    .hero-actions, .action-row, .filters, .badge-row, .mini-row, .tabbar, .toolbar-row, .sort-row { display: flex; gap: 10px; flex-wrap: wrap; }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stat {
      padding: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.03));
      border: 1px solid var(--line);
      border-radius: 18px;
      transition: 180ms ease;
    }

    .stat strong { display: block; font-size: clamp(1.4rem, 3vw, 2rem); margin-bottom: 6px; }
    .stat span { color: var(--muted); font-size: 0.92rem; }

    .tabbar-wrap {
      position: sticky;
      top: 74px;
      z-index: 45;
      padding-top: 14px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 96%, transparent), color-mix(in srgb, var(--bg) 70%, transparent), transparent);
    }

    .tabbar {
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
      flex-wrap: nowrap;
    }

    .tabbar::-webkit-scrollbar { display: none; }
    .tab-btn { white-space: nowrap; flex: 0 0 auto; }

    .content {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 18px;
      margin-top: 18px;
    }

    .stack { display: grid; gap: 18px; }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }

    .section-title h3 { margin: 0; font-size: 1.2rem; }
    .section-title p { margin: 6px 0 0; color: var(--muted); }

    .grid-2, .grid-3, .kpi-grid, .features-grid, .personas-grid, .badge-grid, .skeleton-grid, .explore-grid, .admin-grid {
      display: grid;
      gap: 14px;
    }

    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3, .features-grid, .personas-grid, .badge-grid, .skeleton-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .explore-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .admin-grid { grid-template-columns: 0.9fr 1.1fr; }

    label span, .label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.92rem;
      color: var(--muted);
    }

    input, textarea, select {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.09);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      padding: 13px 14px;
      outline: none;
      transition: 180ms ease;
    }

    body.theme-light input,
    body.theme-light textarea,
    body.theme-light select {
      background: rgba(17,36,60,0.03);
      border-color: rgba(17,36,60,0.08);
    }

    textarea { min-height: 118px; resize: vertical; }

    input:focus, textarea:focus, select:focus {
      border-color: rgba(110,168,254,0.58);
      box-shadow: 0 0 0 4px rgba(110,168,254,0.14);
    }

    .progress-steps {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .step-pill {
      padding: 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      transition: 180ms ease;
    }

    .step-pill.active {
      background: rgba(110,168,254,0.14);
      border-color: rgba(110,168,254,0.36);
    }

    .helper {
      padding: 14px;
      border-radius: 16px;
      background: rgba(126,240,194,0.08);
      border: 1px solid rgba(126,240,194,0.15);
      color: #d8fff2;
      margin-top: 14px;
    }

    body.theme-light .helper {
      color: #13523c;
      background: rgba(31,201,138,0.08);
      border-color: rgba(31,201,138,0.16);
    }

    .card, .result-card, .mission-card, .entry-card, .pin-card, .roadmap-step, .persona-card, .feature-card, .badge-card, .testimonial-card, .skeleton-card, .admin-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      background: rgba(255,255,255,0.035);
    }

    .result-head, .mission-head, .entry-head, .pin-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
    .result-list, .mission-list, .roadmap-list, .journal-list, .pins, .testimonials { display: grid; gap: 12px; }

    .tag, .score, .mode, .level, .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 0.82rem;
    }

    .tag {
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      border: 1px solid rgba(255,255,255,0.07);
    }

    .score {
      font-weight: 700;
      color: #dff1ff;
      background: rgba(110,168,254,0.14);
      border: 1px solid rgba(110,168,254,0.22);
    }

    body.theme-light .score { color: var(--text); }

    .level {
      background: rgba(126,240,194,0.12);
      border: 1px solid rgba(126,240,194,0.18);
      color: #d8fff2;
    }

    body.theme-light .level { color: #14533d; }

    .mode {
      background: rgba(255,209,102,0.12);
      border: 1px solid rgba(255,209,102,0.2);
      color: #ffe7a3;
    }

    body.theme-light .mode { color: #7d5a09; }

    .pill {
      background: rgba(110,168,254,0.1);
      border: 1px solid rgba(110,168,254,0.18);
      color: var(--text);
    }

    .muted { color: var(--muted); }
    .small { font-size: 0.9rem; color: var(--muted); }

    .empty {
      border: 1px dashed rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 18px;
      color: var(--muted);
      background: rgba(255,255,255,0.02);
    }

    .roadmap-step {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 14px;
      align-items: start;
    }

    .step-index {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-weight: 800;
      background: linear-gradient(135deg, rgba(110,168,254,0.18), rgba(126,240,194,0.16));
    }

    .kpi {
      border-radius: 18px;
      border: 1px solid var(--line);
      padding: 16px;
      background: rgba(255,255,255,0.03);
    }

    .kpi strong { display: block; font-size: 1.48rem; margin-bottom: 4px; }

    .xp-bar {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.07);
      overflow: hidden;
      margin-top: 12px;
    }

    .xp-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--primary));
      width: 0%;
      transition: width 300ms ease;
    }

    .ring-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .progress-ring {
      width: 120px;
      height: 120px;
      position: relative;
      flex: 0 0 auto;
    }

    .progress-ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .progress-ring .ring-label {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      pointer-events: none;
    }

    .ring-number {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1;
    }

    .ring-caption {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .badge-card.locked { opacity: 0.58; }
    .badge-card.unlocked {
      animation: unlockPop 460ms ease;
    }

    .badge-emoji { font-size: 1.5rem; }

    .map-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .landing-hero {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 18px;
      align-items: stretch;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 65;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      backdrop-filter: blur(16px);
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      border-top: 1px solid var(--line);
      display: none;
    }

    .bottom-nav-inner {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: min(100%, 680px);
      margin: 0 auto;
    }

    .bottom-nav a {
      text-align: center;
      padding: 10px 8px;
      font-size: 0.84rem;
      border-radius: 16px;
    }

    .toast {
      position: fixed;
      right: 16px;
      bottom: calc(88px + env(safe-area-inset-bottom));
      z-index: 90;
      background: rgba(11,23,39,0.96);
      border: 1px solid rgba(126,240,194,0.18);
      color: #eafff5;
      padding: 12px 14px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: 180ms ease;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.xp { animation: xpPulse 700ms ease; }

    .hidden { display: none !important; }

    .autosave {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.84rem;
      margin-top: 10px;
    }

    .autosave-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--success);
      box-shadow: 0 0 0 0 rgba(141,231,168,0.4);
      animation: pulse 1.6s infinite;
    }

    .mission-toolbar, .explore-toolbar {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .sort-row {
      align-items: center;
      justify-content: flex-start;
    }

    .score-breakdown {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .score-line {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-size: 0.9rem;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 10, 18, 0.62);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal-backdrop.show { display: flex; }

    .modal {
      width: min(100%, 760px);
      max-height: 90vh;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
      margin-bottom: 14px;
    }

    .close-btn {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 1rem;
    }

    .share-banner {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid rgba(110,168,254,0.18);
      background: rgba(110,168,254,0.08);
      color: var(--text);
    }

    .readonly-shell {
      width: min(100% - 24px, 920px);
      margin: 32px auto;
      padding-bottom: 40px;
    }

    .readonly-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .readonly-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
      margin-bottom: 16px;
    }

    .admin-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .mini-stat {
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .mini-stat strong {
      display: block;
      font-size: 1.2rem;
      margin-bottom: 4px;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(141,231,168,0.35); }
      70% { box-shadow: 0 0 0 10px rgba(141,231,168,0); }
      100% { box-shadow: 0 0 0 0 rgba(141,231,168,0); }
    }

    @keyframes xpPulse {
      0% { transform: translateY(10px) scale(0.98); }
      40% { transform: translateY(0) scale(1.02); }
      100% { transform: translateY(0) scale(1); }
    }

    @keyframes unlockPop {
      0% { transform: scale(0.96); }
      55% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    @media (max-width: 1024px) {
      .hero, .content, .landing-hero, .admin-grid { grid-template-columns: 1fr; }
      .brand-copy p { max-width: 52vw; }
    }

    @media (max-width: 720px) {
      .topbar-inner {
        flex-direction: column;
        align-items: flex-start;
        padding: 12px 0;
      }
      .topbar-actions { width: 100%; justify-content: space-between; }
      .shell { width: min(100% - 16px, var(--max)); }
      .topbar-inner { width: min(100% - 16px, var(--max)); }
      .panel { padding: 18px; border-radius: 18px; }
      .stats, .grid-2, .grid-3, .kpi-grid, .features-grid, .personas-grid, .badge-grid, .landing-hero, .map-grid, .progress-steps, .skeleton-grid, .explore-grid, .mission-toolbar, .explore-toolbar {
        grid-template-columns: 1fr;
      }
      .hero h2 { max-width: none; }
      .tabbar-wrap { display: none; }
      .bottom-nav { display: block; }
      .brand-copy p { max-width: 100%; }
      .action-row > * , .hero-actions > * { flex: 1 1 auto; }
      .btn { width: 100%; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .progress-ring { margin-inline: auto; }
    }

    @media (max-width: 430px) {

          <div class="grid-2">

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    function getSkillGapList() {
      const selected = getCareerById(state.selectedCareer) || inferBestCareer();
      if (!selected) return [];
      const skills = normalize(state.profile.skills);
      return selected.gaps.filter(gap => !skills.includes(normalize(gap.split(' ')[0]))).slice(0, 3);
    }

    function renderSkillGap() {
      const gap = getSkillGapList();
      if (!gap.length) {
        el.skillGapBox.innerHTML = `<strong>${t('skillGapTitle')}</strong><div class="small" style="margin-top:6px;">${t('skillGapEmpty')}</div>`;

    function inferBestCareer() {
      return state.results[0] ? getCareerById(state.results[0].id) : null;

    function getCareerById(id) {
      return careerCatalog.find(c => c.id === id);

    function showResultsSkeleton() {
      el.resultsSkeleton.classList.remove('hidden');
      el.resultsSkeleton.innerHTML = Array.from({ length: 3 }).map(() => `<div class="skeleton-card"><strong>${t('resultsThinking')}</strong><div class="small" style="margin-top:8px;">...</div></div>`).join('');
      el.resultsList.innerHTML = '';
    }

    function scoreCareer(career) {
      const interests = normalize(state.profile.interests);
      const skills = normalize(state.profile.skills);
      const pref = state.profile.preference;
      const exp = state.profile.experience;
      const goal = state.profile.goal;

      let score = 45;
      const breakdown = [];

      if (pref === 0 && career.domain === 'Tech') { score += 22; breakdown.push(['+22', 'Tech preference match']); }
      if (pref === 1 && ['Educație','Sănătate'].includes(career.domain)) { score += 20; breakdown.push(['+20', 'People / community preference']); }
      if (pref === 2 && career.domain === 'Design') { score += 24; breakdown.push(['+24', 'Creative preference match']); }
      if (pref === 3 && career.domain === 'Mediu') { score += 24; breakdown.push(['+24', 'Nature / action preference']); }

      let tagPoints = 0;
      career.tags.forEach(tag => {
        if (interests.includes(normalize(tag)) || skills.includes(normalize(tag))) tagPoints += 7;
      });
      if (tagPoints) {
        score += tagPoints;
        breakdown.push([`+${tagPoints}`, 'Interests / skills match']);
      }

      if (goal === 1 && ['ux','pm','data'].includes(career.id)) { score += 8; breakdown.push(['+8', 'Portfolio-aligned path']); }
      if (goal === 2 && ['community','green','health'].includes(career.id)) { score += 8; breakdown.push(['+8', 'Volunteering-aligned path']); }
      if (exp === 0 && ['community','ux','health'].includes(career.id)) { score += 5; breakdown.push(['+5', 'Beginner-friendly']); }
      if (exp === 2 && ['data','pm','green'].includes(career.id)) { score += 6; breakdown.push(['+6', 'Advanced-ready path']); }

      return { ...career, score: Math.min(98, score), breakdown };
    }

    function generateRecommendations() {
      showResultsSkeleton();
      saveState();

      setTimeout(() => {
        const scored = careerCatalog.map(scoreCareer).sort((a,b) => b.score - a.score);
        state.allCareerScores = scored.map(item => ({ id: item.id, score: item.score, breakdown: item.breakdown }));
        state.results = scored.slice(0,3).map(item => ({ id: item.id, score: item.score, breakdown: item.breakdown }));
        state.selectedCareer = scored[0]?.id || null;
        saveState();
        el.resultsSkeleton.classList.add('hidden');
        renderDynamic();
      }, 700);
    }

    function renderMissionSort() {
      el.missionSortSelect.innerHTML = `
        <option value="default">${t('missionSortDefault')}</option>
        <option value="xp" ${state.missionSort === 'xp' ? 'selected' : ''}>${t('missionSortXp')}</option>
        <option value="level" ${state.missionSort === 'level' ? 'selected' : ''}>${t('missionSortLevel')}</option>
        <option value="mode" ${state.missionSort === 'mode' ? 'selected' : ''}>${t('missionSortMode')}</option>
      `;
      el.missionSearchInput.value = state.missionSearch;

    function missionMatchesFilter(m) {
      if (state.missionFilter === 'All') return true;
      if (state.missionFilter === 'Favorite') return state.savedMissionIds.includes(m.id);
      return m.domain === state.missionFilter;
    }

    function getFilteredMissions() {
      const query = normalize(state.missionSearch);
      let list = missions().filter(missionMatchesFilter).filter(m => {
        if (!query) return true;
        const title = normalize(m[state.locale].title);
        const city = normalize(m.city);
        const org = normalize(m.org);
        return title.includes(query) || city.includes(query) || org.includes(query);
      });

      if (state.missionSort === 'xp') {
        list.sort((a,b) => b.xp - a.xp);
      } else if (state.missionSort === 'level') {
        const order = t('levelOrder');
        list.sort((a,b) => order.indexOf(a.level) - order.indexOf(b.level));
      } else if (state.missionSort === 'mode') {
        list.sort((a,b) => a.mode.localeCompare(b.mode));
      }

      return list;
    }

        const card = document.createElement('article');
        card.className = 'mission-card';
        card.innerHTML = `
          <div class="mission-head">
            <div>
              <strong>${mission[state.locale].title}</strong>
              <div class="small">${mission.org} · ${mission.city}</div>

            <span class="tag">${mission.level}</span>
          </div>
        `;

        const actions = document.createElement('div');
        actions.className = 'action-row';

        const viewBtn = document.createElement('button');
        viewBtn.className = 'btn ghost';
        viewBtn.textContent = t('missionSelect');
        viewBtn.onclick = () => {
          state.selectedMissionId = mission.id;
          saveState();
          renderMap();
          document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        const detailBtn = document.createElement('button');
        detailBtn.className = 'btn ghost';
        detailBtn.textContent = 'Details';
        detailBtn.onclick = () => openMissionModal(mission);

        const saveBtn = document.createElement('button');
        saveBtn.className = `btn ghost ${saved ? 'active' : ''}`;
        saveBtn.textContent = saved ? t('missionSaved') : t('missionSave');
        saveBtn.onclick = () => {
          if (saved) state.savedMissionIds = state.savedMissionIds.filter(id => id !== mission.id);
          else state.savedMissionIds.unshift(mission.id);
          saveState();
          renderDynamic();
        };

        const applyBtn = document.createElement('button');
        applyBtn.className = 'btn ghost';
        applyBtn.textContent = t('missionApply');
        applyBtn.onclick = () => showToast('Demo CTA');

        const doneBtn = document.createElement('button');
        doneBtn.className = done ? 'btn ghost' : 'btn success';
        doneBtn.textContent = done ? '✓' : t('missionComplete');
        doneBtn.disabled = done;
        doneBtn.onclick = () => {
          if (!done) {
            state.completedMissionIds.unshift(mission.id);
            state.xp += mission.xp;
            touchActivity();
            saveState();
            renderDynamic();
            showToast(t('missionDoneToast'), 'xp');
          }
        };

        actions.append(viewBtn, detailBtn, saveBtn, applyBtn, doneBtn);
        card.appendChild(actions);
        el.missionList.appendChild(card);
      });
    }

    function touchActivity() {
      const today = new Date();
      const todayStr = dateKey(today);
      if (!state.lastActiveDate) {
        state.streak = 1;
        state.lastActiveDate = todayStr;
        return;
      }

      const prev = new Date(state.lastActiveDate + 'T00:00:00');
      const diffDays = Math.floor((new Date(todayStr + 'T00:00:00') - prev) / 86400000);

      if (diffDays === 0) {
        return;
      } else if (diffDays === 1) {
        state.streak += 1;
      } else {
        state.streak = 1;
      }
      state.lastActiveDate = todayStr;
    }

    function dateKey(d) {
      return new Date(d).toISOString().slice(0,10);
    }

      `;
      el.cvPreview.innerHTML = `<p class="muted">${escapeHtml(cvText())}</p>`;
      el.shareBanner.innerHTML = `${t('shareBanner')} <strong>${escapeHtml(getShareableProfileUrl())}</strong>`;
      renderReadonlyProfile();
    }

    function renderReadonlyProfile() {
      const best = getCareerById(state.selectedCareer);
      const completed = state.completedMissionIds.map(id => missions().find(m => m.id === id)).filter(Boolean);
      el.readonlyName.textContent = state.profile.name || 'ALPIS User';
      el.readonlyRole.textContent = best ? best[state.locale].title : t('readonlyRoleFallback');
      el.readonlyProfileBody.innerHTML = `
        <div class="badge-row">
          <span class="tag">XP ${state.xp}</span>
          <span class="tag">L${currentLevel()}</span>
          <span class="tag">${state.completedMissionIds.length} missions</span>
          <span class="tag">streak ${state.streak}</span>
        </div>
        <p class="muted" style="margin-top:14px;">${state.profile.interests || '-'}</p>
        <div class="helper">
          <strong>${t('completedPortfolio')}</strong>
          <div class="journal-list" style="margin-top:10px;">
            ${completed.length ? completed.map(m => `<div class="tag">${m[state.locale].title}</div>`).join('') : `<div class="small">-</div>`}
          </div>
        </div>
      `;
    }

    function renderLandingFeatures() {
      el.landingFeatures.innerHTML = '';
      t('features').forEach(([title, desc]) => {
        const card = document.createElement('div');
        card.className = 'feature-card';
        card.innerHTML = `<strong>${title}</strong><p class="small" style="margin-top:8px;">${desc}</p>`;
        el.landingFeatures.appendChild(card);
      });
    }

    function renderPersonas() {
      el.personasGrid.innerHTML = '';
      t('personas').forEach(([title, desc]) => {
        const card = document.createElement('div');
        card.className = 'persona-card';
        card.innerHTML = `<strong>${title}</strong><div class="small" style="margin-top:8px;">${desc}</div>`;
        el.personasGrid.appendChild(card);
      });
    }

    function renderTestimonials() {
      el.testimonialsList.innerHTML = '';
      t('testimonials').forEach(([name, text]) => {
        const card = document.createElement('div');
        card.className = 'testimonial-card';
        card.innerHTML = `<strong>${name}</strong><p class="small" style="margin-top:8px;">“${text}”</p>`;
        el.testimonialsList.appendChild(card);
      });
    }

    function renderAdminInputs() {
      el.adminMissionDomainSelect.innerHTML = ['Tech','Design','Educație','Sănătate','Mediu'].map(v => `<option value="${v}">${v}</option>`).join('');
      el.adminMissionModeSelect.innerHTML = t('modeOptions').map(v => `<option value="${v}">${v}</option>`).join('');
      el.adminMissionLevelSelect.innerHTML = t('levelOrder').map(v => `<option value="${v}">${v}</option>`).join('');
    }

    function renderAdmin() {
      el.adminTotalMissions.textContent = String(missions().length);
      el.adminCompletedMissions.textContent = String(state.completedMissionIds.length);
      el.adminSavedMissions.textContent = String(state.savedMissionIds.length);

      el.adminMissionList.innerHTML = missions().map(m => `
        <div class="card">
          <div class="result-head">
            <div>
              <strong>${m[state.locale].title}</strong>
              <div class="small">${m.org} · ${m.city}</div>
            </div>
            <span class="tag">+${m.xp} XP</span>
          </div>
          <div class="badge-row">
            <span class="tag">${m.domain}</span>
            <span class="tag">${m.level}</span>
            <span class="tag">${m.mode}</span>
          </div>
        </div>
      `).join('');
    }

    function openMissionModal(mission) {
      el.missionModalTitle.textContent = mission[state.locale].title;
      el.missionModalMeta.textContent = `${mission.org} · ${mission.city} · ${mission.domain} · +${mission.xp} XP`;
      el.missionModalBody.innerHTML = `
        <div class="card">
          <strong>${t('missionModalExtended')}</strong>
          <p class="muted" style="margin-top:8px;">${mission.extended[state.locale]}</p>
        </div>
        <div class="grid-2" style="margin-top:14px;">
          <div class="card">
            <strong>${t('missionModalSkills')}</strong>
            <div class="journal-list" style="margin-top:10px;">
              ${mission.skills.map(s => `<div class="tag">${s}</div>`).join('')}
            </div>
          </div>
          <div class="card">
            <strong>${t('missionModalImpact')}</strong>
            <p class="muted" style="margin-top:8px;">${mission.impact}</p>
          </div>
        </div>
      `;
      el.missionModalBackdrop.classList.add('show');
    }

    function closeMissionModal() {
      el.missionModalBackdrop.classList.remove('show');
    }

    function renderDynamic() {
      renderResults();
      renderRoadmap();
      renderMissions();
      renderProgress();
      renderBadges();
      renderMap();
      renderJournal();
      renderProfile();
      renderSkillGap();
      renderAdmin();
    }

    function fillSample() {
      state.profile = {
        name: t('sampleName'),
        goal: 1,
        preference: 2,
        interests: t('sampleInterests'),
        skills: t('sampleSkills'),
        experience: 1
      };
      state.currentStep = 0;
      saveState();
      renderStepper();
      renderDynamic();
    }

    function resetAll() {
      localStorage.removeItem('alpis-impactpath-v35');
      location.reload();
    }

    function handleReadonlyMode() {
      const url = new URL(window.location.href);
      const readonly = url.searchParams.get('view') === 'profile' || window.location.hash === '#profile-view';
      el.readonlyView.classList.toggle('hidden', !readonly);
      el.appShell.classList.toggle('hidden', readonly);
      document.getElementById('topbar').classList.toggle('hidden', readonly);
    }

    el.prevStepBtn.addEventListener('click', () => {
      if (state.currentStep > 0) {
        state.currentStep -= 1;
        saveState();
        renderStepper();
      }
    });

    el.nextStepBtn.addEventListener('click', () => {
      if (state.currentStep < 3) {
        state.currentStep += 1;
        saveState();
        renderStepper();
      } else {
        generateRecommendations();
      }
    });

    el.sampleBtn.addEventListener('click', fillSample);
    el.demoFillBtn.addEventListener('click', () => { fillSample(); generateRecommendations(); });
    el.resetBtn.addEventListener('click', resetAll);

    el.langBtn.addEventListener('click', () => {
      state.locale = state.locale === 'ro' ? 'en' : 'ro';
      saveState();
      renderStatic();
      renderDynamic();
    });

    el.themeBtn.addEventListener('click', () => {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      saveState();
      applyTheme();
    });

    el.explainBtn.addEventListener('click', () => {
      const best = inferBestCareer();
      showToast(best ? `${best[state.locale].title}` : 'Run onboarding first');
    });

    el.viewAllDirectionsBtn.addEventListener('click', () => {
      state.exploreMode = !state.exploreMode;
      saveState();
      renderExploreGrid();
    });

    el.missionSearchInput.addEventListener('input', (e) => {
      state.missionSearch = e.target.value;
      saveState();
      renderMissions();
    });

    el.missionSortSelect.addEventListener('change', (e) => {
      state.missionSort = e.target.value;
      saveState();
      renderMissions();
    });

    el.careerSearchInput.addEventListener('input', (e) => {
      state.careerSearch = e.target.value;
      saveState();
      renderExploreGrid();
    });

    el.careerDomainFilter.addEventListener('change', (e) => {
      state.careerDomain = e.target.value;
      saveState();
      renderExploreGrid();
    });

    el.saveJournalBtn.addEventListener('click', () => {
      const text = el.journalInput.value.trim();
      if (!text) return;
      state.journal.unshift({ text, date: new Date().toISOString() });
      touchActivity();
      el.journalInput.value = '';
      saveState();
      renderDynamic();
      showToast(t('entrySaved'));
    });

    el.linkedinBtn.addEventListener('click', () => {
      const latest = state.journal[0]?.text || '';
      state.linkedinDraft = t('linkedinTemplate')(state.profile.name, missions().length, state.xp, latest);
      saveState();
      renderJournal();
    });

    el.copyProfileBtn.addEventListener('click', () => copyToClipboard(profileText()));
    el.copyCvBtn.addEventListener('click', () => copyToClipboard(cvText()));
    el.shareProfileBtn.addEventListener('click', () => copyToClipboard(getShareableProfileUrl()));

    el.exportJsonBtn.addEventListener('click', () => {
      downloadFile('alpis-impactpath-profile.json', JSON.stringify(state, null, 2));
    });

    el.waitlistBtn.addEventListener('click', () => showToast('Demo CTA'));
    el.watchDemoBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    el.exitReadonlyBtn.addEventListener('click', () => {
      const url = new URL(window.location.href);
      url.searchParams.delete('view');
      url.hash = '';
      window.history.replaceState({}, '', url.toString());
      handleReadonlyMode();
    });

    el.closeMissionModal.addEventListener('click', closeMissionModal);
    el.missionModalBackdrop.addEventListener('click', (e) => {
      if (e.target === el.missionModalBackdrop) closeMissionModal();
    });

    el.adminAddMissionBtn.addEventListener('click', () => {
      const title = el.adminMissionTitleInput.value.trim();
      const org = el.adminMissionOrgInput.value.trim();
      const city = el.adminMissionCityInput.value.trim();
      const domain = el.adminMissionDomainSelect.value;
      const mode = el.adminMissionModeSelect.value;
      const level = el.adminMissionLevelSelect.value;
      const xp = Math.max(5, Number(el.adminMissionXpInput.value || 15));
      const desc = el.adminMissionDescInput.value.trim();

      if (!title || !org || !city || !desc) return;

      const newMission = {
        id: Date.now(),
        domain,
        mode,
        city,
        org,
        xp,
        level,
        skills: ['coordination','communication','impact delivery'],
        impact: 'This mission helps an organization turn intention into visible community action.',
        extended: {
          ro: desc,
          en: desc
        },
        ro: { title, desc },
        en: { title, desc }
      };

      state.customMissions.unshift(newMission);
      saveState();
      renderDynamic();
      el.adminMissionTitleInput.value = '';
      el.adminMissionOrgInput.value = '';
      el.adminMissionCityInput.value = '';
      el.adminMissionXpInput.value = '';
      el.adminMissionDescInput.value = '';
      showToast(t('adminMissionAdded'));
    });

    renderStatic();
    renderDynamic();
    handleReadonlyMode();
  </script>
</body>
</html>
